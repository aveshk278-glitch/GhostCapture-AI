name: Build GhostCapture APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # NOTE: ubuntu-latest already has the Android SDK pre-installed,
      # so no separate SDK setup step is needed.
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        # NOTE: builds with the installed Gradle directly (not ./gradlew)
        # because the GitHub push used for this project only carries UTF-8
        # text files, so gradle/wrapper/gradle-wrapper.jar is not in the
        # repository. The gradlew script is still in the repo for local use.
        # Retry up to 3 times: Maven Central sometimes rate-limits (HTTP 429)
        # the shared runner IP, which is transient and not a code error.
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt of 3"
            if gradle assembleDebug --stacktrace; then
              echo "Build succeeded on attempt $attempt"
              exit 0
            fi
            echo "Build attempt $attempt failed; waiting 60s before retry..."
            sleep 60
          done
          echo "Build failed after 3 attempts"
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
